
import subprocess
import os
import sys
from http.server import BaseHTTPRequestHandler, HTTPServer

VM = "gaming-vm"
RAM_MB = 20480       # 20 GB
VCPUS = 8
DISK_SIZE = "150G"
DISK = "/var/lib/libvirt/images/gaming-vm.qcow2"
ISO = "/var/lib/libvirt/images/Windows.iso"
PORT = 8000


def cmd(*args):
    p = subprocess.run(
        list(args),
        capture_output=True,
        text=True
    )
    return p.returncode == 0, p.stdout.strip(), p.stderr.strip()


def status():
    ok, out, err = cmd("virsh", "domstate", VM)
    return out if ok else "VM não encontrada"


def start():
    ok, out, err = cmd("virsh", "start", VM)
    return out if ok else err


def stop():
    ok, out, err = cmd("virsh", "shutdown", VM)
    return out if ok else err


def reboot():
    ok, out, err = cmd("virsh", "reboot", VM)
    return out if ok else err


def create_vm():

    if not os.path.exists(DISK):
        ok, out, err = cmd(
            "qemu-img",
            "create",
            "-f",
            "qcow2",
            DISK,
            DISK_SIZE
        )

        if not ok:
            return "Erro criando disco: " + err

    ok, out, err = cmd(
        "virt-install",
        "--name", VM,
        "--memory", str(RAM_MB),
        "--vcpus", str(VCPUS),
        "--cpu", "host-passthrough",
        "--disk",
        f"path={DISK},format=qcow2,bus=virtio",
        "--cdrom", ISO,
        "--os-variant", "win11",
        "--network",
        "network=default,model=virtio",
        "--graphics", "spice",
        "--video", "virtio",
        "--boot", "uefi",
        "--tpm", "default",
        "--noautoconsole"
    )

    return out if ok else err


HTML = """
