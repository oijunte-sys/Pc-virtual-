class Server(BaseHTTPRequestHandler):

    def send_text(self, text):

        data = text.encode()

        self.send_response(200)

        self.send_header(
            "Content-Type",
            "text/plain; charset=utf-8"
        )

        self.send_header(
            "Content-Length",
            str(len(data))
        )

        self.end_headers()

        self.wfile.write(data)


    def do_GET(self):

        if self.path == "/":

            data = HTML.encode()

            self.send_response(200)

            self.send_header(
                "Content-Type",
                "text/html; charset=utf-8"
            )

            self.send_header(
                "Content-Length",
                str(len(data))
            )

            self.end_headers()

            self.wfile.write(data)

            return


        if self.path == "/api/status":

            self.send_text(status())

            return

        self.send_error(404)


    def do_POST(self):

        if self.path == "/api/start":

            self.send_text(start())
            return

        if self.path == "/api/stop":

            self.send_text(stop())
            return

        if self.path == "/api/reboot":

            self.send_text(reboot())
            return

        if self.path == "/api/create":

            self.send_text(create_vm())
            return

        self.send_error(404)


print("""
